# Traefik 3.6 + Let's Encrypt (HTTP-01).
# Проекты могут иметь свои внутренние сети (app_network и т.п.).
# Наружу открывайте только нужные сервисы, дополнительно подключая их к общей сети traefik.

services:
  traefik:
    image: traefik:v3.6.14
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./letsencrypt:/letsencrypt
    command:
      - --configFile=/etc/traefik/traefik.yml
    networks:
      - traefik

networks:
  # Общая edge-сеть для Traefik и публичных контейнеров из разных проектов.
  traefik:
    name: traefik
    driver: bridge
